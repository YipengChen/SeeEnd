name: Compact draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      build_run_id:
        description: Successful desktop build run providing all original artifacts
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: compact-draft-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: seeend-*
          path: dist/release-assets
          merge-multiple: true
      - name: Verify original tag, all platform receipts and source archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python packaging/release_assets.py present --source-root release-source --assets-dir dist/release-assets --output-dir dist/public-assets --tag "$RELEASE_TAG"
      - name: Verify replacement uploads before removing merged attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python .github/scripts/update_compact_draft.py --tag "$RELEASE_TAG" --assets-dir dist/release-assets --public-dir dist/public-assets
