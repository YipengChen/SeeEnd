name: Build desktop preview
on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Desktop build runner
        type: choice
        default: all
        options: [all, windows-latest, macos-14, ubuntu-22.04]
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target_os != 'all') && format('["{0}"]', inputs.target_os) || '["macos-14","windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,build]"
      - name: Diagnose Windows desktop lifecycle
        if: runner.os == 'Windows'
        run: python -X faulthandler -m unittest discover -s tests -p test_desktop_runtime.py -v
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python packaging/build.py --verify-native --download-sources
      - run: python packaging/verify_frozen.py
      - run: python packaging/archive.py
      - run: python packaging/extension_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: seeend-${{ matrix.os }}
          path: dist/SeeEnd-*
