name: Build desktop preview
on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Desktop build runner
        type: choice
        default: all
        options: [all, windows-latest, macos-14, ubuntu-22.04]
      probe_only:
        description: Run focused Windows compatibility diagnostics
        type: boolean
        default: false
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target_os != 'all') && format('["{0}"]', inputs.target_os) || '["macos-14","windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact 0.8.68 source snapshot
        run: python .github/scripts/verify_snapshot.py
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,build]"
      - name: Load Windows fonts for virtual-screen tests
        if: runner.os == 'Windows'
        run: python .github/scripts/windows_fonts.py
      - name: Windows compatibility diagnostics
        if: inputs.probe_only
        run: python .github/scripts/windows_compatibility.py
      - name: Verify Windows sound restart fixture cleanup
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        run: python -m unittest tests.test_sounds.SoundOutputTests.test_preferences_persist_but_pending_audio_does_not_replay_after_restart -v
      - name: Verify frozen startup port guard
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        run: python .github/scripts/test_windows_frozen_startup.py -v
      - if: ${{ !inputs.probe_only && runner.os != 'Windows' }}
        run: python -m unittest discover -s tests -v
      - name: Verify Windows source integration regressions
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        # The unchanged compiled core was covered by the prior full audit below.
        run: python -m unittest discover -s tests -p test_desktop_services.py -v
      - name: Verify Windows source fleet regressions
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        run: python -m unittest discover -s tests -p test_device_fleet.py -v
      - if: ${{ !inputs.probe_only }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: ${{ !inputs.probe_only }}
        run: npm test
      - name: Build exact same product after targeted fixture cleanup (prior full audit 39028892983)
        if: ${{ !inputs.probe_only }}
        # Product source is unchanged; retain native-import checks without repeating the prior full suite.
        run: python packaging/build.py --download-sources
      - if: ${{ !inputs.probe_only }}
        run: python packaging/verify_frozen.py
      - if: ${{ !inputs.probe_only }}
        run: python packaging/archive.py
      - if: ${{ !inputs.probe_only }}
        run: python packaging/extension_release.py
      - name: Preserve built archives before GUI acceptance
        uses: actions/upload-artifact@v4
        if: always() && !inputs.probe_only && hashFiles('dist/SeeEnd-*.zip') != ''
        with:
          name: seeend-${{ matrix.os }}
          path: dist/SeeEnd-*
          if-no-files-found: error
      - name: Verify native Windows widgets
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python .github/scripts/windows_compatibility.py --native-smoke
      - name: Verify frozen Windows GUI startup
        if: runner.os == 'Windows' && !inputs.probe_only
        env:
          QT_QPA_PLATFORM: windows
        run: python .github/scripts/windows_frozen_startup.py
      - name: Record Windows audit evidence scope
        if: always() && runner.os == 'Windows' && !inputs.probe_only
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Windows audit scope: product source remains canonical f845c7dc18f50bcafe95b97da73d9da8971b1c0d2d078ae94e0609498cf18dae.

          Prior full compiled regression: [run 39028892983](https://github.com/YipengChen/SeeEnd/actions/runs/39028892983), 840 tests: 823 passed, 16 skipped, 0 assertion failures, 1 Windows temporary SQLite fixture cleanup error.

          This follow-up fixes that test fixture and a CI-only startup port probe (run 39030419466 stopped before launching the GUI). Both have targeted preflight checks. It retains the 36 compiled native import checks, frozen/helper verification, archive checks, and actual frozen Windows GUI startup checks. The full 840-test compiled regression is not repeated; consult individual step outcomes for checks reached and passed in this run.
          SUMMARY
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && !inputs.probe_only
        with:
          name: seeend-windows-diagnostics
          path: |
            validation/windows-frozen-startup
            validation/windows-compatibility
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && inputs.probe_only
        with:
          name: windows-compatibility
          path: validation/windows-compatibility
