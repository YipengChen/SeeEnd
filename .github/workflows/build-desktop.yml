name: Build desktop preview
on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Desktop build runner
        type: choice
        default: all
        options: [all, windows-latest, macos-14, ubuntu-22.04]
      probe_only:
        description: Run focused Windows compatibility diagnostics
        type: boolean
        default: false
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target_os != 'all') && format('["{0}"]', inputs.target_os) || '["macos-14","windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact 0.8.67 source snapshot
        run: python .github/scripts/verify_snapshot.py
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,build]"
      - name: Load Windows fonts for virtual-screen tests
        if: runner.os == 'Windows'
        run: python .github/scripts/windows_fonts.py
      - name: Windows compatibility diagnostics
        if: inputs.probe_only
        run: python .github/scripts/windows_compatibility.py
      - if: ${{ !inputs.probe_only && runner.os != 'Windows' }}
        run: python -m unittest discover -s tests -v
      - name: Verify Windows source integration regressions
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        # The build step runs the complete suite against the compiled core.
        run: python -m unittest discover -s tests -p test_desktop_services.py -v
      - name: Verify Windows source fleet regressions
        if: ${{ !inputs.probe_only && runner.os == 'Windows' }}
        run: python -m unittest discover -s tests -p test_device_fleet.py -v
      - if: ${{ !inputs.probe_only }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: ${{ !inputs.probe_only }}
        run: npm test
      - if: ${{ !inputs.probe_only }}
        run: python packaging/build.py --verify-native --download-sources
      - if: ${{ !inputs.probe_only }}
        run: python packaging/verify_frozen.py
      - if: ${{ !inputs.probe_only }}
        run: python packaging/archive.py
      - if: ${{ !inputs.probe_only }}
        run: python packaging/extension_release.py
      - name: Verify native Windows widgets
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python .github/scripts/windows_compatibility.py --native-smoke
      - uses: actions/upload-artifact@v4
        if: always() && inputs.probe_only
        with:
          name: windows-compatibility
          path: validation/windows-compatibility
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe_only }}
        with:
          name: seeend-${{ matrix.os }}
          path: dist/SeeEnd-*
