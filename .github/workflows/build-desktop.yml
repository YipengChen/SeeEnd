name: Build desktop preview
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,build]"
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python packaging/prepare_licenses.py --download
      - run: python packaging/build.py
      - run: python packaging/verify_frozen.py
      - run: python packaging/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: seeend-${{ matrix.os }}
          path: dist/SeeEnd-*
