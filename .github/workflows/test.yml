name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop]"
      - run: python tools/check_workspace.py
      - run: python .github/scripts/test_release_assets.py
      - run: python -m unittest discover -s tests -v
      - name: Verify skill integration against this checkout
        env:
          SEEEND_APP_ROOT: ${{ github.workspace }}
        run: python -m unittest discover -s skill/tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
