name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop]"
      - run: python tools/check_workspace.py
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python .github/scripts/test_release_assets.py
      - run: python -m unittest discover -s tests -v
      - name: Verify skill integration against this checkout
        env:
          SEEEND_APP_ROOT: ${{ github.workspace }}
        run: python -m unittest discover -s skill/tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
