[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seeend"
version = "0.8.6"
description = "SeeEnd: local AI task notifications with optional Yeelight lamps"
readme = "README.md"
license = "LicenseRef-SeeEnd-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6==6.11.0", "pyobjc-framework-Cocoa==12.1; sys_platform == 'darwin'", "pyobjc-framework-UserNotifications==12.1; sys_platform == 'darwin'"]
build = ["pyinstaller==6.22.3", "Cython==3.3.0", "PyYAML==6.0.3"]

[project.gui-scripts]
seeend = "aiflame.__main__:main"
ai-flame = "aiflame.__main__:main"
[project.scripts]
seeend-hub = "aiflame.hub.server:main"
ai-flame-hub = "aiflame.hub.server:main"

[tool.setuptools.packages.find]
include = ["aiflame*"]
namespaces = false

[tool.setuptools.package-data]
aiflame = ["assets/extension-guide/*.png", "assets/extension-guide/*.jpg", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.icns", "assets/locales/*.json", "assets/brands/*", "assets/devices/*.svg", "integrations/chatgpt_web/extension/*", "integrations/cli_tools/deepseek_bundle/*", "integrations/cli_tools/opencode_bundle/*"]
