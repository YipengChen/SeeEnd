<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火焰实验室 · SeeEnd</title><link rel="stylesheet" href="/tuning.css"></head>
<body><header><a href="/">← SeeEnd</a><span>HARDWARE FLAME LAB / 01</span></header>
<main><section class="intro"><p class="eyebrow">找到你心里的那束火</p><h1>火焰实验室<span>。</span></h1><p>拖动参数，直接观察实体灯。每一次变化，都由硬件上的火焰呈现。</p></section>
<div class="layout"><aside><div class="panel"><span class="eyebrow">实时硬件</span><h2>连接你的火焰</h2><label for="device">目标设备</label><select id="device"></select><p id="connection">正在读取设备…</p><button id="start" class="primary" disabled>开始实时调参</button><button id="stop" disabled>停止调参</button><p id="message" role="status" aria-live="polite">正在加载参数…</p><small>调试期间，此设备显示调试火焰，暂时覆盖任务灯效。关闭页面或失联约 6 秒后恢复任务灯效。</small></div>
<div class="panel"><h3>参数方案</h3><label for="preset">起点</label><select id="preset"><option value="default">默认 · 完成火焰</option><option value="quiet">安静烛火</option><option value="lively">灵动火焰</option><option value="working">微弱工作火焰</option></select><button id="save">保存到此浏览器</button><button id="restore">读取已保存方案</button><div class="pair"><button id="export">导出 JSON</button><button id="import">导入 JSON</button></div><input id="file" type="file" accept="application/json,.json" hidden><button id="reset">恢复默认参数</button><small>保存的参数供本页再次调试使用；不会改写日常任务的默认灯效。灯板是暖黄色单色，不能调整色相。</small></div></aside>
<section><div class="section-head"><h2>雕刻火焰</h2><span id="count"></span></div><div id="controls"></div></section></div></main><script type="module" src="/tuning.js"></script></body></html>
